<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Territories Manager" />
    <title>Territories Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Fullscreen Map Container -->
    <div id="map-container" class="map-container"></div>

    <!-- Premium Dashboard Sidebar -->
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
        <!-- Sidebar Header -->
        <header class="sidebar-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 17 22 12"></polyline>
                </svg>
            </div>
            <div class="logo-title">
                <h1>ტერიტორიების მენეჯერი</h1>
                <span class="sub-title">Yandex Maps ინტეგრაცია</span>
            </div>
        </header>

        <!-- Search Bar -->
        <section class="search-section">
            <div class="search-wrapper">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="მოძებნე ქუჩა ან კოორდინატი..." />
            </div>
        </section>

        <!-- Map Provider Switcher -->
        <section class="map-switcher-section">
            <h3>რუკის ტიპი</h3>
            <div class="switcher-buttons">
                <button class="switcher-btn" data-provider="google-street">Google Maps</button>
                <button class="switcher-btn" data-provider="maptiler">MapTiler</button>
                <button class="switcher-btn active" data-provider="yandex">Yandex Maps</button>
            </div>
        </section>

        <!-- Action Panel -->
        <footer class="sidebar-footer">
            <div class="map-coordinates-box">
                <div class="coord-label">მიმდინარე კოორდინატები:</div>
                <div class="coord-values" id="coord-display">41.674333, 44.875718</div>
            </div>
        </footer>
    </aside>

    <!-- Premium Animated Splash Loader -->
    <div id="app-loader" class="app-loader">
        <div class="loader-content">
            <div class="premium-spinner"></div>
            <div class="loader-title">რუკა იტვირთება</div>
            <div class="loader-subtitle">ტერიტორიების მართვის პანელი...</div>
        </div>
    </div>
</body>


</html>
