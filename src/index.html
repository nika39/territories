<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Territories Manager" />
    <title>Territories Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Fullscreen Map Container -->
    <div id="map-container" class="map-container"></div>

    <!-- Premium Dashboard Sidebar -->
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
        <!-- Sidebar Header -->
        <header class="sidebar-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 17 22 12"></polyline>
                </svg>
            </div>
            <div class="logo-title">
                <h1>ტერიტორიების მენეჯერი</h1>
                <span class="sub-title">Yandex Maps ინტეგრაცია</span>
            </div>
        </header>

        <!-- Search Bar -->
        <section class="search-section">
            <div class="search-wrapper">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="მოძებნე ქუჩა ან კოორდინატი..." />
            </div>
        </section>

        <!-- Map Provider Switcher -->
        <section class="map-switcher-section">
            <h3>რუკის ტიპი</h3>
            <div class="switcher-buttons">
                <button class="switcher-btn" data-provider="google-street">Google Maps</button>
                <button class="switcher-btn" data-provider="maptiler">MapTiler</button>
                <button class="switcher-btn active" data-provider="yandex">Yandex Maps</button>
            </div>
        </section>

        <!-- Marked Territories Section -->
        <section class="geoman-section" id="geoman-section">
            <!-- Color Palette for Drawing -->
            <div class="drawing-color-row">
                <span class="color-row-label">ხატვის ფერი:</span>
                <div class="color-chips" id="drawing-color-chips">
                    <button type="button" class="color-chip active" data-color="#007aff" style="--chip-color: #007aff;" title="ლურჯი"></button>
                    <button type="button" class="color-chip" data-color="#34c759" style="--chip-color: #34c759;" title="მწვანე"></button>
                    <button type="button" class="color-chip" data-color="#ff9500" style="--chip-color: #ff9500;" title="ნარინჯისფერი"></button>
                    <button type="button" class="color-chip" data-color="#ff3b30" style="--chip-color: #ff3b30;" title="წითელი"></button>
                    <button type="button" class="color-chip" data-color="#af52de" style="--chip-color: #af52de;" title="იისფერი"></button>
                </div>
            </div>



            <!-- List of Drawn Objects -->
            <div class="drawn-objects-container">
                <div class="empty-drawn-state" id="empty-drawn-state">
                    <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>მონიშნეთ ტერიტორია მარჯვენა პანელიდან</span>
                </div>
                <div class="drawn-objects-list" id="drawn-objects-list" style="display: none;"></div>
            </div>

            <!-- Batch Actions for Drawn Objects -->
            <div class="drawn-batch-actions" id="drawn-batch-actions" style="display: none;">
                <button type="button" id="btn-export-drawn-geojson" class="action-btn-mini primary" title="ყველა მონიშნულის GeoJSON-ის კოპირება">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>GeoJSON ექსპორტი</span>
                </button>
                <button type="button" id="btn-clear-all-drawn" class="action-btn-mini danger" title="ყველა მონიშნული ობიექტის წაშლა">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>ყველას წაშლა</span>
                </button>
            </div>
        </section>

        <!-- GeoJSON Import Section -->
        <section class="geojson-section">
            <div class="geojson-header">
                <h3>GeoJSON პოლიგონი</h3>
                <button type="button" id="btn-toggle-fill" class="toggle-fill-btn" title="შიდა ნაწილის გამჭვირვალობის ჩართვა/გამორთვა">
                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    </svg>
                    <span>მხოლოდ კონტური</span>
                </button>
            </div>
            <div class="geojson-textarea-wrapper">
                <textarea 
                    id="geojson-input" 
                    placeholder="ჩასვით GeoJSON (FeatureCollection, Feature ან Polygon)..." 
                    rows="4" 
                    spellcheck="false"
                ></textarea>
            </div>
            <div class="geojson-actions">
                <button type="button" id="btn-draw-geojson" class="action-btn primary" title="GeoJSON პოლიგონის დამატება რუკაზე">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>დამატება</span>
                </button>
                <button type="button" id="btn-clear-geojson" class="action-btn secondary" title="პოლიგონის გასუფთავება">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>გასუფთავება</span>
                </button>
            </div>
            <div id="geojson-feedback" class="geojson-feedback" style="display: none;"></div>
        </section>

        <!-- Action Panel -->
        <footer class="sidebar-footer">
            <div class="map-coordinates-box">
                <div class="coord-label">მიმდინარე კოორდინატები:</div>
                <div class="coord-values" id="coord-display">41.674333, 44.875718</div>
            </div>
        </footer>
    </aside>

    <!-- Premium Animated Splash Loader -->
    <div id="app-loader" class="app-loader">
        <div class="loader-content">
            <div class="premium-spinner"></div>
            <div class="loader-title">რუკა იტვირთება</div>
            <div class="loader-subtitle">ტერიტორიების მართვის პანელი...</div>
        </div>
    </div>
</body>


</html>
